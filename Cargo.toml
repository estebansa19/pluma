[package]
name = "pluma"
version = "0.1.0"
edition = "2021"
description = "Ultralight configurator for Logitech G mice (DPI, polling rate and onboard memory)"
license = "MIT"
repository = "https://github.com/estebansa19/pluma"
publish = false

[dependencies]
# UI: egui painted on the CPU (src/shell.rs). No eframe/OpenGL: the GPU driver alone added
# ~130 MB of RAM just to open the window.
egui = { version = "0.29", default-features = false }
egui-winit = { version = "0.29", default-features = false }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
